{{ define "main" }}

  <div class="t-wrap">
    <span class="t-eyebrow">Brand</span>
    <h1 style="margin:.9rem 0 .5rem">The tie family.</h1>
    <p class="tagline">{{ .Params.description }}</p>

<div class="t-wrap">

</div>
