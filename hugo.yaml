# The tie website: tie, the tie apps and anneal.
#
# Everything here builds with plain Hugo. Generated data (facts, docs, shots,
# CLI reference) is committed by `make update`, so you never need the sibling
# repositories just to build the site.

baseURL: https://tiedb.com/
title: tie
locale: en-us
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: false
capitalizeListTitles: false

module:
  imports:
    - path: github.com/imfing/hextra
  hugoVersion:
    min: "0.146.0"
    extended: true

mediaTypes:
  text/markdown:
    suffixes: [md]

outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    isHTML: false
    notAlternative: true
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home: [html, rss, llms]
  page: [html, markdown]
  section: [html, rss]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    lineNumbersInTable: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - name: tie
      pageRef: /tie
      weight: 1
    - name: Apps
      pageRef: /apps
      weight: 2
    - name: anneal
      pageRef: /anneal
      weight: 3
    - name: Docs
      pageRef: /docs
      weight: 4
    - name: Search
      weight: 20
      params:
        type: search

params:
  description: >-
    tie is a local-first, content-addressed library for your files, music and
    photos — tagged, deduplicated, and mountable as plain folders. Native apps
    to enjoy it, and anneal, a coding agent that improves its own harness.
  author:
    name: Johan Straarup
    link: https://github.com/uidbz

  theme:
    default: dark
    displayToggle: true

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: brand/tie.svg
      dark: brand/tie.svg
      width: 30
      height: 30
    width: wide

  footer:
    displayPoweredBy: false
    displayCopyright: false
    width: wide

  page:
    width: wide
    displayPagination: false
    contextMenu:
      enable: true
      # No third-party "open in ChatGPT" links: everything here stays local,
      # and SourceHut Pages forbids target="_blank" anyway.
      links: []

  search:
    enable: true
    type: flexsearch
    flexsearch:
      js: js/flexsearch.js

  imageZoom: true
  math:
    enable: false
  # Diagram engines and analytics stay off: no CDNs, no trackers.
  mermaid:
    enable: false
  katex:
    enable: false
  analytics:
    enable: false
  icons:
    remote:
      enable: false

  banner: false

  # Multiple of the same layout partials, rendered by the theme.
  llms:
    enable: true

taxonomies:
  tag: tags

privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
  instagram:
    disable: true
  vimeo:
    disable: true
  youtube:
    disable: true
